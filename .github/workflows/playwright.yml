# Playwright UI tests — https://playwright.dev/docs/ci-intro
#
# Job strategy:
#   PR          → Smoke (Chromium) only — fast feedback, no duplicate runs
#   Push main   → Full matrix (chromium, firefox, webkit) — cross-browser on merge
#   Schedule    → Smoke (Chromium) — weekly health check
#   Manual run  → Full matrix

name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

env:
  BASE_URL: ${{ vars.BASE_URL }}
  # Use Node 24 for JavaScript-based Actions (avoids Node 20 deprecation warnings).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    name: Smoke (Chromium)
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:ci
        env:
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-smoke
          path: test-results/
          retention-days: 14

  full-browsers:
    name: Full (${{ matrix.browser }})
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        run: npm test -- --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
